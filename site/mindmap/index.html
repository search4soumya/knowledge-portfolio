<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mind Map — Design Principles</title>
  <meta name="description" content="Build a mind map in the browser: add ideas, drag them, collapse branches, and export PNG or JSON. No libraries required.">
  <link rel="canonical" href="https://search4soumya.github.io/knowledge-portfolio/mindmap/">
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/tool-shell.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#map">Skip to mind map</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../index.html">
        <img src="../images/portrait.jpg" alt="" width="36" height="36">
        <span class="brand-name">Design Principles</span>
      </a>
      <nav class="header-nav" aria-label="Site">
        <a class="header-link" href="../index.html">Home</a>
        <a class="header-link" href="../blueprint/">Blueprint Designer</a>
        <a class="header-link" href="../whiteboard/">Whiteboard</a>
        <a class="header-link" href="./" aria-current="page">Mind Map</a>
        <a class="header-link" href="../about.html">About me</a>
      </nav>
    </div>
  </header>

  <div class="tool-shell">
    <header class="topbar">
      <div class="app-brand"><span class="brand-mark" aria-hidden="true"></span><span>Mind Map</span></div>
      <div class="actions">
        <button type="button" data-action="child" title="Add a child idea (Tab)">Add child</button>
        <button type="button" data-action="sibling" title="Add a sibling idea (Enter)">Add sibling</button>
        <button type="button" data-action="collapse" title="Collapse or expand the selected branch">Collapse</button>
        <button type="button" data-action="layout" title="Arrange the tree from the root">Auto layout</button>
        <span class="sep"></span>
        <button type="button" data-action="undo" title="Undo (Ctrl+Z)">Undo</button>
        <button type="button" data-action="redo" title="Redo (Ctrl+Y)">Redo</button>
        <button type="button" data-action="delete" title="Delete the selected idea (Del)">Delete</button>
        <span class="sep"></span>
        <div class="swatches" aria-label="Node color">
          <button type="button" class="color-swatch" data-color="#10b981" style="background:#10b981" title="Emerald"></button>
          <button type="button" class="color-swatch" data-color="#f59e0b" style="background:#f59e0b" title="Gold"></button>
          <button type="button" class="color-swatch" data-color="#6366f1" style="background:#6366f1" title="Indigo"></button>
          <button type="button" class="color-swatch" data-color="#38bdf8" style="background:#38bdf8" title="Sky"></button>
          <button type="button" class="color-swatch" data-color="#f472b6" style="background:#f472b6" title="Pink"></button>
        </div>
        <span class="sep"></span>
        <button type="button" data-action="open">Open</button>
        <button type="button" data-action="save">Save</button>
        <button type="button" data-action="png" class="primary">Export PNG</button>
        <input id="open-file" type="file" accept=".json,application/json" hidden>
      </div>
    </header>
    <main class="stage">
      <svg id="map" tabindex="0" aria-label="Mind map canvas">
        <defs>
          <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="1" fill="#162033"/>
          </pattern>
        </defs>
        <rect class="grid" width="100%" height="100%" fill="url(#dots)"/>
        <g id="viewport">
          <g id="edges"></g>
          <g id="nodes"></g>
        </g>
      </svg>
      <div class="empty-hint" id="empty-hint" hidden></div>
      <div class="zoombar">
        <button type="button" data-action="zoom-out">-</button>
        <button type="button" data-action="zoom-reset" id="zoom-label">100%</button>
        <button type="button" data-action="zoom-in">+</button>
        <button type="button" data-action="zoom-fit">Fit</button>
      </div>
      <div class="statusbar">Click a node to select · Double-click to edit · Tab child · Enter sibling · Drag to move a branch · Wheel zooms</div>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
